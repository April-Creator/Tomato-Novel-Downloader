name: Build Legacy (x86-64 baseline)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  musl-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential pkg-config libssl-dev cmake git

      - name: Install Rust + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # 关键修复 1：切换到不依赖 Official-API 的构建
      - name: Switch to no-official-api build
        run: cp Cargo_no_official.toml Cargo.toml

      - name: Build
        env:
          RUSTFLAGS: -C target-cpu=x86-64
        run: |
          set -o pipefail
          cargo build --release --target x86_64-unknown-linux-musl 2>&1 | tee build.log | tail -60
          exit ${PIPESTATUS[0]}

      - name: Save full log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: musl-build-log
          path: build.log

      - name: Package
        if: success()
        run: |
          BIN=$(find target/x86_64-unknown-linux-musl/release -maxdepth 1 -type f -executable ! -name '*.so' | head -1)
          tar czf tomato-legacy-musl-amd64.tar.gz -C target/x86_64-unknown-linux-musl/release "$(basename "$BIN")"

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: legacy-amd64
          files: tomato-legacy-musl-amd64.tar.gz

  gnu-compat:
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye
    steps:
      - name: Fix apt sources
        run: |
          echo "deb [trusted=yes] http://archive.debian.org/debian bullseye main" > /etc/apt/sources.list
          echo "deb [trusted=yes] http://archive.debian.org/debian-security bullseye-security main" >> /etc/apt/sources.list
          apt-get update
          apt-get install -y curl build-essential pkg-config libssl-dev git ca-certificates

      - uses: actions/checkout@v4

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      # 关键修复 1：同样切到 no-official-api 构建
      - name: Switch to no-official-api build
        shell: bash
        run: cp Cargo_no_official.toml Cargo.toml

      # 关键修复 2：显式用 bash，绕开 dash 不支持 pipefail 的问题
      - name: Build
        env:
          RUSTFLAGS: -C target-cpu=x86-64
        shell: bash
        run: |
          set -o pipefail
          $HOME/.cargo/bin/cargo build --release 2>&1 | tee build.log | tail -60
          exit ${PIPESTATUS[0]}

      - name: Save full log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gnu-build-log
          path: build.log

      - name: Package
        if: success()
        shell: bash
        run: |
          BIN=$(find target/release -maxdepth 1 -type f -executable ! -name '*.so' | head -1)
          tar czf tomato-legacy-gnu-amd64.tar.gz -C target/release "$(basename "$BIN")"

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: legacy-amd64
          files: tomato-legacy-gnu-amd64.tar.gz
